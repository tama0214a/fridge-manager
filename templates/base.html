<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}研究室冷蔵庫管理{% endblock %}</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🧊%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">🧊 研究室冷蔵庫管理</div>
    <nav>
      <a href="{{ url_for('dashboard') }}" class="{{ 'active' if active_page == 'dash' }}">ダッシュボード</a>
      <a href="{{ url_for('items') }}" class="{{ 'active' if active_page == 'items' }}">保管品一覧</a>
      <a href="{{ url_for('history') }}" class="{{ 'active' if active_page == 'history' }}">履歴</a>
      <a href="{{ url_for('masters') }}" class="{{ 'active' if active_page == 'masters' }}">マスタ管理</a>
      <a href="{{ url_for('settings') }}" class="{{ 'active' if active_page == 'settings' }}">設定</a>
      <a href="{{ url_for('item_new') }}" class="nav-cta">＋ 入庫登録</a>
    </nav>
  </div>
</header>
<main class="container">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for cat, msg in messages %}
      <div class="flash flash-{{ cat }}">{{ msg }}</div>
    {% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
<footer class="app-foot">研究室冷蔵庫管理システム — データはこのPCの data フォルダに保存されています</footer>
{% block scripts %}{% endblock %}
</body>
</html>
